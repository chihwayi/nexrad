version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: development
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-3000}
      API_HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-radius}
      DB_PASSWORD: ${DB_PASSWORD:-radiusPassword}
      DB_NAME: ${DB_NAME:-radius}
      REDIS_URL: 'redis://redis:${REDIS_PORT:-6379}'
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev-refresh-secret}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      WG_INTERFACE: ${WG_INTERFACE:-wg0}
      WG_CONFIG_PATH: ${WG_CONFIG_PATH:-/etc/wireguard/wg0.conf}
      WG_SERVER_ENDPOINT: '${HOST:-localhost}:${WG_PORT:-51820}'
      WG_SUBNET: ${WG_SUBNET:-10.8.0.0/24}
      WG_SERVER_IP: ${WG_SERVER_IP:-10.8.0.1}
      WG_PORT: ${WG_PORT:-51820}
      APP_URL: 'http://${HOST:-localhost}:${WEB_PORT:-5173}'
    volumes:
      - ./packages/api/src:/app/packages/api/src
      - /etc/wireguard:/etc/wireguard:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      target: development
    ports:
      - '${WEB_PORT:-5173}:5173'
    environment:
      VITE_API_URL: 'http://${HOST:-localhost}:${API_PORT:-3000}'
      VITE_WS_URL: 'ws://${HOST:-localhost}:${API_PORT:-3000}'
      VITE_APP_NAME: ${APP_NAME:-NexRAD}
      # Vite dev-server runs inside Docker, so proxy must target the API service on the docker network.
      VITE_DEV_API_PROXY_TARGET: 'http://api:3000'
    volumes:
      - ./packages/web/src:/app/packages/web/src
      - ./packages/web/public:/app/packages/web/public
    depends_on:
      - api
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - '${DB_PORT:-3306}:3306'
    environment:
      MYSQL_DATABASE: ${DB_NAME:-radius}
      MYSQL_USER: ${DB_USER:-radius}
      MYSQL_PASSWORD: ${DB_PASSWORD:-radiusPassword}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./packages/api/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
