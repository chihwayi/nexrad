version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - web_dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: always

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3000}
      API_HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-radius}
      REDIS_URL: 'redis://redis:${REDIS_PORT:-6379}'
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      WG_INTERFACE: ${WG_INTERFACE:-wg0}
      WG_CONFIG_PATH: ${WG_CONFIG_PATH:-/etc/wireguard/wg0.conf}
      WG_SERVER_ENDPOINT: '${HOST}:${WG_PORT:-51820}'
      WG_SUBNET: ${WG_SUBNET:-10.8.0.0/24}
      WG_SERVER_IP: ${WG_SERVER_IP:-10.8.0.1}
      WG_PORT: ${WG_PORT:-51820}
      APP_URL: 'https://${HOST}'
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@nexrad.io}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60000}
    volumes:
      - /etc/wireguard:/etc/wireguard:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  web_builder:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      target: builder
    volumes:
      - web_dist:/app/dist
    environment:
      VITE_API_URL: 'https://${HOST}/api'
      VITE_WS_URL: 'wss://${HOST}/ws'
      VITE_APP_NAME: ${APP_NAME:-NexRAD}

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-radius}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always

volumes:
  mysql_data:
  redis_data:
  web_dist:
