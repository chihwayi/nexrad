version: '3.9'

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./packages/api/src/db/migrations:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u${DB_USER}', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  api:
    image: ghcr.io/${GITHUB_REPO}/nexrad-api:${VERSION:-latest}
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: production
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend, frontend]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  web:
    image: ghcr.io/${GITHUB_REPO}/nexrad-web:${VERSION:-latest}
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      target: production
    restart: always
    networks: [frontend]

  freeradius:
    build:
      context: ./docker/freeradius
      dockerfile: Dockerfile
    restart: always
    ports:
      - '1812:1812/udp'
      - '1813:1813/udp'
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RADIUS_DEFAULT_SECRET: ${RADIUS_DEFAULT_SECRET:-changeme}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/${DOMAIN}/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/${DOMAIN}/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - api
      - web
    networks: [frontend]

networks:
  backend:
  frontend:

volumes:
  mysql_data:
  redis_data:
