# NAS clients are loaded dynamically from the `nas` MySQL table (read_clients = yes in sql module).
# This fallback client allows WireGuard tunnel traffic while individual branch secrets
# are validated per-NAS-IP from the database.

client localhost {
    ipaddr    = 127.0.0.1
    secret    = testing123
    shortname = localhost
}

# Fallback for WireGuard tunnel range — NAS-specific secrets come from the nas table.
# FreeRADIUS will prefer the more specific match from SQL over this wildcard.
client wireguard_tunnel {
    ipaddr    = 10.8.0.0/24
    secret    = ${RADIUS_DEFAULT_SECRET:-changeme}
    shortname = wireguard
    nastype   = other
}
